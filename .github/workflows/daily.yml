name: 🏨 HACCP Autocompilazione Giornaliera

on:
  schedule:
    # Ogni giorno alle 07:00 ora italiana estiva (UTC+2 → 05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      data:
        description: 'Data specifica (YYYY-MM-DD) — lascia vuoto per oggi'
        required: false
        default: ''
  push:
    branches: [ main ]

jobs:
  compila-haccp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Esegui autocompilazione
        run: |
          if [ -n "${{ github.event.inputs.data }}" ]; then
            python run_daily.py "${{ github.event.inputs.data }}"
          else
            python run_daily.py
          fi

      - name: 💾 Commit e push aggiornamenti
        run: |
          git config user.name  "HACCP Bot 🤖"
          git config user.email "haccp-bot@holiday-gardan.it"
          git add output/
          git diff --staged --quiet || git commit -m "🌡️ HACCP aggiornamento automatico $(date +'%d/%m/%Y')"
          git push
