name: 🏨 HACCP Autocompilazione Giornaliera

on:
  schedule:
    # Ogni giorno alle 11:00 ora italiana (UTC+2 in estate → 09:00 UTC).
    # Eseguito DOPO la finestra di rilevazione (08:00-10:30) così l'orario
    # registrato risulta sempre nel passato e mai nel futuro.
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Permette anche l'avvio manuale dalla pagina GitHub Actions
    inputs:
      data:
        description: 'Data specifica (YYYY-MM-DD) — lascia vuoto per oggi'
        required: false
        default: ''

jobs:
  compila-haccp:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessario per fare commit

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Esegui autocompilazione
        run: |
          if [ -n "${{ github.event.inputs.data }}" ]; then
            python run_daily.py "${{ github.event.inputs.data }}"
          else
            python run_daily.py
          fi

      - name: 💾 Commit e push aggiornamenti
        run: |
          git config user.name  "HACCP Bot 🤖"
          git config user.email "haccp-bot@holiday-gardan.it"
          git add output/
          # Commit solo se ci sono cambiamenti
          git diff --staged --quiet || git commit -m "🌡️ HACCP aggiornamento automatico $(date +'%d/%m/%Y')"
          git push
